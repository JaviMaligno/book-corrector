name: Backend CI - Lint and Test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Identify changed source paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if printf '%s\n' "$changed" | grep -Eq '^(corrector/|server/|tests/|pyproject\.toml$|uv\.lock$|settings\.py$|Dockerfile$|\.dockerignore$|README\.md$|docs/|\.github/workflows/backend-ci\.yml$)'; then echo "source=true" >> "$GITHUB_OUTPUT"; fi
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
          python-version: '3.11.17'
      - name: Install frozen dependencies
        run: uv sync --frozen
      - name: Lint (ruff + black --check)
        run: |
          uv run --frozen ruff check .
          uv run --frozen black --check .
      - name: Offline backend contracts
        if: github.event.pull_request.draft == false && steps.scope.outputs.source == 'true'
        run: uv run --frozen pytest -q tests/test_text_utils.py tests/test_engine_apply.py tests/test_auth_dependencies.py tests/test_model_enum_contracts.py tests/test_jwt_migration.py
      - name: Validate both local-source container paths
        if: github.event.pull_request.draft == false && steps.scope.outputs.source == 'true'
        run: |
          docker build -t corrector-security .
          docker build -t corrector-api-security -f server/Dockerfile .
