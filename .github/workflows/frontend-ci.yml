name: Frontend CI - Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Identify changed source paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if printf '%s\n' "$changed" | grep -Eq '^(web/|\.dockerignore$|\.github/workflows/frontend-ci\.yml$)'; then echo "source=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck frontend
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Build frontend bundle
        run: npm run build
      - name: Offline router contract
        if: github.event.pull_request.draft == false && steps.scope.outputs.source == 'true'
        run: node --test --test-concurrency=2 tests/router-contract.test.mjs tests/corrections-contract.test.mjs
      - name: Validate production container
        if: github.event.pull_request.draft == false && steps.scope.outputs.source == 'true'
        working-directory: .
        run: docker build -t corrector-web-security -f web/Dockerfile.prod .
